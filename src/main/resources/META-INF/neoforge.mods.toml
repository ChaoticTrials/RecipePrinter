modLoader="javafml"
loaderVersion="[4,)"
license="${mod.license}"
issueTrackerURL="${mod.issue_url}"

[[mods]]
modId="${mod.modid}"
version="${mod.version}"
displayName="Recipe Printer"
displayURL="${mod.source_url}"
updateJSONURL="https://assets.melanx.de/updates/recipe-printer.json"
authors="MelanX"
description="""
Converts recipes into nice looking images
"""

[[dependencies.${mod.modid}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${mod.neoforge},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod.modid}]]
    modId="minecraft"
    type="required"
    versionRange="[${mod.minecraft},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod.modid}]]
    modId="libx"
    type="required"
    versionRange="[26.1.2-7.0.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod.modid}]]
    modId="jei"
    type="optional"
    versionRange="[19.21.0.247,)"
    ordering="NONE"
    side="BOTH"